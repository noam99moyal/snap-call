<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snap Call: look preview</title>
<!-- Stopped twice is now a setting in the look preview: this old address opens it there (keeping ?new= and the rest). -->
<script>
  const q = new URLSearchParams(location.search);
  q.set('rules', 'twice');
  location.replace('../?' + q.toString() + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=../?rules=twice">
</head>
<body style="background:#0a2c1d"></body>
</html>
